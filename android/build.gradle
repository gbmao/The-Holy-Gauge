// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Build the web assets and sync Capacitor before any Android module starts
// compiling. Capacitor sync refreshes the generated Cordova plugin module.
def syncCapacitorWeb = tasks.register('syncCapacitorWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'cap:sync'
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.application') {
        subproject.tasks.named('preBuild').configure {
            dependsOn syncCapacitorWeb
        }
    }
    subproject.plugins.withId('com.android.library') {
        subproject.tasks.named('preBuild').configure {
            dependsOn syncCapacitorWeb
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
