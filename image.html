<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1d" />
    <title>Minha moto | Controlador da Moto</title>
    <link rel="stylesheet" href="image.css" />
    <script src="image.js" defer></script>
  </head>

  <body>
    <main class="image-app">
      <header class="image-header">
        <a class="icon-button" href="index.html" aria-label="Voltar para o início">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m6-6-6 6 6 6" />
          </svg>
        </a>

        <div class="page-label">
          <span class="brand-dot"></span>
          MINHA MOTO
        </div>

        <button class="icon-button" id="headerUploadButton" type="button" aria-label="Escolher imagem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" />
          </svg>
        </button>
      </header>

      <section class="image-content" aria-labelledby="imageTitle">
        <p class="eyebrow">IDENTIDADE DO VEÍCULO</p>
        <h1 id="imageTitle">Deixe sua moto<br /><span>no centro.</span></h1>
        <p class="intro">
          Escolha uma imagem para personalizar o seu painel.
        </p>

        <figure
          class="image-frame"
          id="imageDropzone"
          tabindex="0"
          role="button"
          aria-label="Escolher ou trocar a imagem da moto"
        >
          <img
            id="motorcycleImage"
            src="honda-xre-300-2015-ganha-inedita-versao-rally.webp"
            alt="Honda XRE 300 Rally"
          />
          <figcaption class="image-hint">
            <span class="hint-icon">+</span>
            Toque para trocar
          </figcaption>
        </figure>

        <input id="imageInput" type="file" accept="image/*" />

        <button class="primary-button" id="chooseImageButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 16.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.5M12 4v11m0-11L7.5 8.5M12 4l4.5 4.5" />
          </svg>
          Escolher outra imagem
        </button>

        <div class="file-status" aria-live="polite">
          <span class="status-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 4.5 4.5L19 7" />
            </svg>
          </span>
          <div>
            <strong id="fileStatusTitle">Imagem atual</strong>
            <small id="fileName">Honda XRE 300 Rally</small>
          </div>
        </div>

        <p class="helper-text">JPG, PNG, WEBP e outros formatos de imagem</p>
      </section>
    </main>
  </body>
</html>
