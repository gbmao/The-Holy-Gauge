name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Conferir versao da tag
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n1)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} nao corresponde a versionName ${VERSION}."
            exit 1
          fi

      - name: Instalar dependencias e sincronizar Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Compilar APK release sem assinatura
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Alinhar, assinar e verificar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Secret ausente: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/holygauge-release.jks"
          chmod 600 "$RUNNER_TEMP/holygauge-release.jks"
          mkdir -p dist

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -v 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/app-aligned.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/holygauge-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/HolyGauge-${GITHUB_REF_NAME}.apk" \
            dist/app-aligned.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            "dist/HolyGauge-${GITHUB_REF_NAME}.apk"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/HolyGauge-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "Holy Gauge ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
