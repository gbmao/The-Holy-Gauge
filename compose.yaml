services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: holy-gauge-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1434:1433"

    volumes:
      - holy-gauge-sql-data:/var/opt/mssql

    restart: unless-stopped

volumes:
  holy-gauge-sql-data:
    external: true
